<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教务文档生成</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">
  <div class="chat-panel">
    <div class="chat-header">
      <div class="avatar">文</div>
      <div class="info">
        <h2>教务文档生成</h2>
        <p>自动填写工具</p>
      </div>
    </div>

    <div class="steps-bar" id="stepsBar">
      <div class="step">选择模板</div>
      <div class="step">识别字段</div>
      <div class="step">信息收集</div>
      <div class="step">核对确认</div>
      <div class="step">生成文档</div>
    </div>

    <div class="chat-messages" id="chatMessages"></div>

    <div class="func-panel">
      <div class="func-grid">
        <button class="func-btn" id="funcAutoFill">
          <span class="func-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg></span>
          <span class="func-text"><span class="title">内置模板</span><span class="desc">选择预设模板生成</span></span>
        </button>
        <button class="func-btn" id="funcUploadTpl">
          <span class="func-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M12 18v-6M9 15h6"/></svg></span>
          <span class="func-text"><span class="title">上传模板</span><span class="desc">上传docx自动识别</span></span>
        </button>
        <button class="func-btn" id="funcCoFill">
          <span class="func-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></span>
          <span class="func-text"><span class="title">人机协同填写</span><span class="desc">AI预填+人工审核</span></span>
        </button>
        <button class="func-btn" id="funcUpload">
          <span class="func-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg></span>
          <span class="func-text"><span class="title">知识文件上传</span><span class="desc">支持多文件批量提取</span></span>
        </button>
      </div>
      <input type="file" id="templateFileInput" accept=".docx,.doc" style="display:none" />
    </div>

    <div class="chat-input">
      <div class="upload-btn" title="上传文件（支持多选）">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
        <input type="file" id="fileInput" accept=".docx,.doc,.pdf,.xlsx,.xls,.csv,.txt" multiple />
      </div>
      <textarea id="userInput" rows="1" placeholder="输入信息或上传文件（支持多选）..."></textarea>
      <button class="send-btn" id="sendBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

  <div class="preview-panel">
    <div class="preview-header">
      <div class="title-area">
        <h3 id="previewTitle">文档预览</h3>
      </div>
      <div class="actions" id="previewActions" style="display:none;">
        <button>下载</button>
        <button class="print-btn">打印</button>
      </div>
    </div>
    <div class="preview-body" id="previewBody">
      <div class="empty-state">
        <div class="icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg></div>
        <h4>文档预览区</h4>
        <p>选择模板后，原始文档将在此显示，您可以在此直接填写信息。</p>
      </div>
    </div>
  </div>

  <!-- 人机协同填写 - 全屏审核视图 -->
  <div class="cofill-view" id="cofillView">
    <div class="cofill-header">
      <div class="left">
        <span class="mode-badge">🤝 人机协同</span>
        <span class="step-text" id="cofillStepText">选择模板</span>
      </div>
      <button class="exit-btn">✕ 退出协同模式</button>
    </div>
    <div class="cofill-body">
      <!-- 左侧：字段审核面板 -->
      <div class="cofill-fields" id="cofillFields">
        <div class="cofill-fields-header">
          <h3 id="cofillFieldsTitle">字段审核</h3>
          <div class="cofill-progress" id="cofillProgress" style="display:none">
            <div class="bar-track"><div class="bar-fill" id="cofillBarFill" style="width:0%"></div></div>
            <span class="pct" id="cofillPct">0%</span>
          </div>
          <div class="cofill-badges" id="cofillBadges" style="display:none"></div>
        </div>
        <div class="cofill-fields-body" id="cofillFieldsBody">
          <!-- 动态填充：步骤引导 / 字段卡片 -->
        </div>
        <div class="cofill-footer" id="cofillFooter" style="display:none">
          <button>取消</button>
          <button>交给AI继续</button>
          <div class="spacer"></div>
          <button class="primary-btn" id="cofillSubmitBtn">确认并生成</button>
        </div>
      </div>
      <!-- 右侧：文档预览 -->
      <div class="cofill-preview">
        <div class="cofill-preview-header">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>
          <span id="cofillPreviewTitle">文档预览</span>
        </div>
        <div class="cofill-preview-body" id="cofillPreviewBody">
          <div class="doc-container" id="cofillDocContainer">
            <!-- 动态填充 -->
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
